# Netlify configuration.
#
# The official Next.js runtime handles the app build/deploy. Scheduled Functions
# live in netlify/functions and declare their cron in-code (config.schedule).

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# poll-scores declares its own schedule via `export const config` (Netlify v2).
# You can also pin it here if you prefer central config:
# [functions."poll-scores"]
#   schedule = "*/5 * * * *"
